<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  :root{
    --paper:#faf7f2;
    --paper-2:#f2ede4;
    --ink:#1a1a1a;
    --ink-60:rgba(26,26,26,.62);
    --ink-40:rgba(26,26,26,.42);
    --ink-15:rgba(26,26,26,.15);
    --ink-08:rgba(26,26,26,.08);
    --accent: oklch(0.55 0.04 45);
    --serif:'EB Garamond', 'Times New Roman', serif;
    --sans:'Inter', system-ui, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    font-size:15px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  a{color:inherit;text-decoration:none}
  h1,h2,h3,h4{margin:0;font-weight:400;letter-spacing:-0.01em}
  p{margin:0}
  img{max-width:100%;display:block}
  .serif{font-family:var(--serif)}
  .italic{font-style:italic}
  .mono-label{
    font-family:var(--sans);
    font-size:11px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--ink-60);
    font-weight:500;
  }
  .rule{height:1px;background:var(--ink-15);width:100%}
  .rule-short{height:1px;background:var(--ink);width:36px;display:inline-block}
  .section{padding:120px 48px;max-width:1280px;margin:0 auto}
  .section-head{display:grid;grid-template-columns:120px 1fr;gap:32px;margin-bottom:64px;align-items:baseline}
  .section-num{font-family:var(--serif);font-style:italic;font-size:20px;color:var(--ink-40)}
  .section-title{font-family:var(--serif);font-size:clamp(38px,5vw,64px);line-height:1.02;letter-spacing:-0.02em}
  .section-title em{font-style:italic;color:var(--ink-60);font-weight:400}
  @media (max-width:720px){
    .section{padding:80px 24px}
    .section-head{grid-template-columns:1fr;gap:12px;margin-bottom:40px}
  }
  /* placeholder */
  .ph{
    background:
      repeating-linear-gradient(135deg, rgba(26,26,26,.04) 0 1px, transparent 1px 12px),
      var(--paper-2);
    border:1px solid var(--ink-15);
    display:flex;align-items:center;justify-content:center;
    font-family:var(--sans);font-size:10px;letter-spacing:.2em;
    text-transform:uppercase;color:var(--ink-60);
    aspect-ratio:4/5;
    position:relative;
  }
  .ph::after{
    content:"";position:absolute;inset:0;
    background:radial-gradient(ellipse at center, transparent 60%, rgba(26,26,26,0.04) 100%);
    pointer-events:none;
  }
</style>
</head>
<body>
<div id="root"></div>

</html>
